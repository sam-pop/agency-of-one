name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node tests/run.mjs
      - run: for f in skills/agency-of-one/scripts/*.mjs hooks/*.mjs; do node --check "$f"; done
      - run: node -e "for (const f of ['.claude-plugin/plugin.json','.claude-plugin/marketplace.json','hooks/hooks.json','skills/agency-of-one/references/decks.json']) JSON.parse(require('fs').readFileSync(f,'utf8'))"
