name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      # Playwright so the rendered checks (beauty checks, the screenshot --file server's
      # dotfile/traversal/Host guards) run here instead of being skipped
      - run: npm i --no-save playwright@1 && npx playwright install --with-deps chromium
      - run: node tests/run.mjs
        env: { AOO_REQUIRE_RENDER: "1" }
      - run: for f in skills/agency-of-one/scripts/*.mjs hooks/*.mjs; do node --check "$f"; done
      - run: node -e "for (const f of ['.claude-plugin/plugin.json','.claude-plugin/marketplace.json','hooks/hooks.json','skills/agency-of-one/references/decks.json']) JSON.parse(require('fs').readFileSync(f,'utf8'))"
